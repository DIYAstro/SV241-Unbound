[env:Firmware_ESP32]
; Pinned to the pioarduino fork (github.com/pioarduino/platform-espressif32), not the plain
; "espressif32" registry name - the official PlatformIO registry entry for that name resolves to
; a much older, no-longer-actively-maintained platform (Arduino-ESP32 core 2.x era) that's
; missing APIs this firmware actually uses (ledcAttach, esp_task_wdt_config_t/_reconfigure -
; both Arduino-ESP32 core 3.x/ESP-IDF 5.x additions). Leaving this unpinned worked by accident on
; any machine that happened to already have an old pioarduino platform cached locally (pio doesn't
; re-resolve/upgrade an already-installed platform on its own) but broke on a genuinely fresh
; install - e.g. a GitHub Actions runner - which resolves the bare name fresh and gets the old
; official one instead. Pinned to the exact release this firmware is verified to build against
; (v0.9.20's real release binaries were built with this same version).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps = 
	bblanchon/ArduinoJson@7.4.3
	adafruit/Adafruit SHT4x Library@^1.0.5
	adafruit/Adafruit INA219@^1.2.3
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@4.0.6
	dlloydev/QuickPID@^3.1.9
extra_scripts = 
