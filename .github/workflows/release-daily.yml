name: Daily Prerelease Build

# Runs every night, but only actually builds/publishes something if AscomAlpacaProxy/ or src/
# changed since the last daily build - otherwise it's a no-op (no wasted CI minutes, no empty
# releases). When it does build, it publishes to a single rolling "daily" tag/release (always the
# same tag, force-moved each day) rather than a fresh dated tag - no separate pruning needed, and
# testers get one stable link that's always "whatever's newest". Proxy and firmware each carry a
# `-daily.<short-sha-of-last-touching-commit>` version suffix so a running instance can still be
# identified even though the tag name alone doesn't change day to day - and, crucially, so the
# suffix stays IDENTICAL across days where that particular component didn't actually change (see
# the "Compute this build's daily version" step below for why that matters).
#
# Deliberately mirrors the manual beta-release process documented in
# AscomAlpacaProxy/build_scripts/readme.md ("Cutting a beta / pre-release"), just automated:
# bump release_version.json, create a *pre-release* tag, then run release-firmware.yml ->
# release-windows.yml -> release-linux.yml against it. Like that manual process,
# release-webflasher.yml is intentionally NEVER called here - it deploys the single, public,
# always-live GitHub Pages site, which must stay on stable firmware only.
#
# release-firmware.yml specifically only runs when src/ changed (it's the slowest job here by
# far) - release-windows.yml/release-linux.yml still run on any change, since a firmware-only day
# still needs a fresh proxy build to bundle the new firmware.zip. See the check job's two
# independent change flags and the firmware/windows job `if:` conditions below.
on:
  schedule:
    - cron: "17 2 * * *" # daily at 02:17 UTC - off the hour, and off cleanup-old-runs.yml's
                          # Sunday 03:00 UTC slot, just to avoid piling multiple scheduled runs
                          # into the same minute.
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed since the last daily build"
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-release
  cancel-in-progress: true

# Same union-of-needs reasoning as release-all.yml: a reusable workflow can never be granted more
# than its caller has. Only contents: write is needed here (for the tag push + gh release
# create/edit/upload) - no pages/id-token, since release-webflasher.yml is never called.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      firmware_changed: ${{ steps.diff.outputs.firmware_changed }}
      proxy_changed: ${{ steps.diff.outputs.proxy_changed }}
      prev_sha: ${{ steps.prev.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # Resolves to the tag commit's *parent*, not the tag commit itself: the tag always points
      # at a synthetic version-bump commit (release_version.json etc. patched to that day's
      # version), which never matches HEAD's clean values in those same files even when nothing
      # real changed - diffing against it would make the change-check below fire every single
      # day. The parent is the actual last real main commit that bump was built from.
      - name: Resolve the previous daily build's commit
        id: prev
        run: |
          git fetch origin --tags --force
          if git rev-parse -q --verify refs/tags/daily^{commit} > /dev/null; then
            SHA=$(git rev-parse refs/tags/daily^{commit}^1)
          else
            SHA=""
          fi
          echo "Previous daily commit: ${SHA:-<none, first run>}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # firmware_changed and proxy_changed are tracked independently so the firmware job (by far
      # the slowest part of this pipeline) can be skipped on days where only AscomAlpacaProxy/
      # changed - see the firmware/windows/linux jobs' `if:` below. windows/linux still run on
      # *either* flag: a firmware-only change still needs a fresh proxy build to bundle the new
      # firmware.zip for the flasher/UpdateBanner to pick up.
      - name: Check for relevant changes since the last daily build
        id: diff
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force=true, building everything regardless of changes"
            FW_CHANGED=true
            PROXY_CHANGED=true
          elif [ -z "${{ steps.prev.outputs.sha }}" ]; then
            echo "No previous daily build found (first run) - building everything"
            FW_CHANGED=true
            PROXY_CHANGED=true
          else
            FW_CHANGED=false
            PROXY_CHANGED=false
            git diff --quiet ${{ steps.prev.outputs.sha }}..HEAD -- src || FW_CHANGED=true
            git diff --quiet ${{ steps.prev.outputs.sha }}..HEAD -- AscomAlpacaProxy || PROXY_CHANGED=true
          fi

          echo "firmware_changed=$FW_CHANGED" >> "$GITHUB_OUTPUT"
          echo "proxy_changed=$PROXY_CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$FW_CHANGED" = "true" ] || [ "$PROXY_CHANGED" = "true" ]; then
            echo "Building (firmware_changed=$FW_CHANGED, proxy_changed=$PROXY_CHANGED)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under AscomAlpacaProxy/ or src/ since the last daily build - skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Hash of the last commit that actually touched each component's own path, not today's
      # date/HEAD - keeps the version STABLE across daily runs that didn't change that
      # component (e.g. a proxy-only day leaves fw_version untouched). This matters concretely
      # for firmware: UpdateBanner.vue does a strict string comparison between what's flashed on
      # the ESP32 and what's bundled in the running proxy, so a version that changed every day
      # regardless of actual content would nag users to reflash identical firmware.
      - name: Compute this build's daily version
        id: ver
        run: |
          PROXY_BASE=$(jq -r '.proxyVersion' AscomAlpacaProxy/build_scripts/release_version.json)
          FW_BASE=$(jq -r '.firmwareVersion' AscomAlpacaProxy/build_scripts/release_version.json)
          PROXY_HASH=$(git log -1 --format=%h -- AscomAlpacaProxy)
          FW_HASH=$(git log -1 --format=%h -- src)
          echo "proxy_version=${PROXY_BASE}-daily.${PROXY_HASH}" >> "$GITHUB_OUTPUT"
          echo "fw_version=${FW_BASE}-daily.${FW_HASH}" >> "$GITHUB_OUTPUT"

      # Only ever committed locally in this runner's checkout, never pushed to main - the
      # "daily" tag (moved below) is the only thing that will ever reference this commit. Once
      # tomorrow's run force-moves the tag past it, it becomes unreachable and Git's normal
      # garbage collection cleans it up on its own - the usual pattern for a rolling nightly tag.
      - name: Bump release_version.json and sync it into versioninfo.json / config_manager.h
        run: |
          jq -n \
            --arg pv "${{ steps.ver.outputs.proxy_version }}" \
            --arg fv "${{ steps.ver.outputs.fw_version }}" \
            '{proxyVersion: $pv, firmwareVersion: $fv}' \
            > AscomAlpacaProxy/build_scripts/release_version.json
          bash AscomAlpacaProxy/build_scripts/sync_versions.sh "$(pwd)" "$(pwd)/AscomAlpacaProxy"

      - name: Commit the version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AscomAlpacaProxy/build_scripts/release_version.json AscomAlpacaProxy/versioninfo.json src/config_manager.h
          git commit -m "Daily build ${{ steps.ver.outputs.proxy_version }}"

      # Against the last *stable* tag, not the last daily build - with dailies firing at most
      # once a day, "since the last daily" is often just one commit and tells a tester nothing
      # about what they're actually getting relative to the release everyone else is running.
      # --exclude=daily keeps the rolling daily tag itself from matching.
      - name: Generate release notes from what changed since the last stable release
        run: |
          LAST_STABLE=$(git describe --tags --abbrev=0 --exclude=daily HEAD~1 2>/dev/null || true)
          if [ -n "$LAST_STABLE" ]; then
            git log "$LAST_STABLE"..HEAD~1 --oneline > release-notes.txt
          else
            echo "First daily build." > release-notes.txt
          fi
          cat release-notes.txt

      # Moves the tag only - never deletes+recreates the release. A release's "target commit" is
      # whatever its tag currently resolves to, so force-moving the tag is enough; deleting it
      # first would also wipe any assets (firmware.zip in particular) that a skipped firmware job
      # this run is relying on still being there from a previous one.
      - name: Move the rolling 'daily' tag and update the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f daily
          git push origin daily --force
          if gh release view daily >/dev/null 2>&1; then
            gh release edit daily \
              --title "Daily build $(date -u +%Y-%m-%d)" \
              --notes-file release-notes.txt
          else
            gh release create daily \
              --prerelease \
              --title "Daily build $(date -u +%Y-%m-%d)" \
              --notes-file release-notes.txt
          fi

  # Only runs when src/ actually changed - by far the slowest job in this pipeline, no reason to
  # pay for it on a proxy-only day. Its firmware.zip stays on the release from whenever it last
  # legitimately ran (uploaded with --clobber, never deleted - see the publish job above).
  firmware:
    needs: [check, publish]
    if: needs.check.outputs.firmware_changed == 'true'
    uses: ./.github/workflows/release-firmware.yml
    with:
      release_tag: daily
    secrets: inherit

  # Runs whenever publish ran at all (i.e. firmware_changed OR proxy_changed - proxy still needs
  # rebuilding on a firmware-only day, to bundle the fresh firmware.zip for the flasher). `always()`
  # is needed here because `firmware` being skipped would otherwise auto-skip this job too -
  # skipped is a normal, expected outcome for firmware, not a reason to stop the chain.
  windows:
    needs: [publish, firmware]
    if: |
      always() &&
      needs.publish.result == 'success' &&
      needs.firmware.result != 'failure'
    uses: ./.github/workflows/release-windows.yml
    with:
      release_tag: daily
    secrets: inherit

  linux:
    needs: windows
    if: always() && needs.windows.result == 'success'
    uses: ./.github/workflows/release-linux.yml
    with:
      release_tag: daily
    secrets: inherit
