name: Build & Publish Windows Installer

# Manual only, on purpose - matches the other release-*.yml workflows. Downloads the firmware
# already built by release-firmware.yml (never builds its own copy - see build_installer.bat's
# SKIP_FIRMWARE_BUILD support), builds the Windows installer, and uploads it to the release.
#
# First time this project has used a windows-latest runner - untested beyond local review, most
# likely spot to need a follow-up fix on the first real run (Inno Setup's install path via
# Chocolatey matching build_installer.bat's hardcoded ISCC path is the main risk).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build against / attach the installer to (blank = current 'latest' release)"
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to build against / attach the installer to (blank = current 'latest' release)"
        required: false
        type: string

permissions:
  contents: write # needed for `gh release upload`

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: AscomAlpacaProxy/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Inno Setup
        run: choco install -y innosetup

      - name: Resolve target release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = (gh release view --json tagName -q .tagName)
          }
          Write-Host "Target release: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      # Pulls the exact same firmware release-firmware.yml already built and published - this
      # workflow never compiles firmware itself.
      - name: Download and extract firmware.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.tag.outputs.tag }}" -p firmware.zip -O firmware.zip
          $dest = "AscomAlpacaProxy\frontend-vue\public\flasher\firmware"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Expand-Archive -Path firmware.zip -DestinationPath $dest -Force

      # SKIP_FIRMWARE_BUILD=1 makes build_exe.bat (called from build_installer.bat) skip its own
      # PlatformIO/pio run step and just use the firmware.zip contents just extracted above.
      - name: Build installer
        env:
          SKIP_FIRMWARE_BUILD: "1"
        run: |
          & "AscomAlpacaProxy\build_scripts\build_installer.bat"
          if ($LASTEXITCODE -ne 0) { throw "build_installer.bat failed with exit code $LASTEXITCODE" }

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "AscomAlpacaProxy\build\SV241-AscomAlpacaProxy-Setup-*.exe" | Select-Object -First 1
          gh release upload "${{ steps.tag.outputs.tag }}" $installer.FullName --clobber
